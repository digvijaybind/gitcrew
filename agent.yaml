spec_version: "0.1.0"
name: crew
version: 1.0.0
description: >-
  A tiny dev company that lives in a git repo. Four specialists (pm, engineer,
  qa, marketer) plus a coordinating crew lead turn a one-line product idea into
  a real, committed, working prototype. Agents as repos.
model:
  preferred: "openai:gpt-4o-mini"
  fallback: []
  constraints:
    temperature: 0.7
    max_tokens: 4096
tools: [cli, read, write, memory]
runtime:
  max_turns: 60
  timeout: 300
workflows: [build]
knowledge: [product-playbook]
