spec_version: "0.1.0"
name: marketer
version: 1.0.0
description: Shippit. Writes README.md and CHANGELOG.md and cuts the release tag.
model:
  preferred: "openai:gpt-4o-mini"
  fallback: []
  constraints:
    temperature: 0.7
    max_tokens: 3072
tools: [cli, read, write, memory]
runtime:
  max_turns: 12
  timeout: 120
