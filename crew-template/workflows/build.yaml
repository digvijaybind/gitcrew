name: build
version: 1
description: End-to-end product build pipeline for the crew.
steps:
  - id: brief
    name: Brief
    agent: ceo
    description: Read PROJECT.md, write BRIEF.md, checkpoint.
  - id: plan
    name: Plan
    agent: pm
    description: Write PRD.md and TASKS.md, checkpoint.
  - id: build
    name: Build
    agent: engineer
    description: Implement the product in app/, committing per milestone.
  - id: review
    name: Review
    agent: qa
    description: Audit app/, write REVIEW.md, fix findings, checkpoint.
  - id: ship
    name: Ship
    agent: marketer
    description: Write README.md and CHANGELOG.md, tag v1.0.0.
