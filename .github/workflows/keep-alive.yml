name: keep-alive

on:
  schedule:
    # Ping every 10 min so the free Render instance never hits the
    # 15-minute inactivity spin-down.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          URL="https://gitcrew.onrender.com/api/health"
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            elapsed=$(( $(date +%s) - start ))
            echo "attempt $attempt: HTTP $code in ${elapsed}s — $(cat /tmp/body.txt)"
            if [ "$code" = "200" ]; then
              if [ "$elapsed" -gt 10 ]; then
                echo "::notice::Backend was cold (${elapsed}s) — now warmed."
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Backend did not return 200 after 3 attempts."
          exit 0
