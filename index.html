<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Packing Checklist — Tailored lists for any trip</title>
  <meta name="description" content="Get a personalized packing checklist based on your destination, season, and trip length. No sign-up, no app.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="container">
      <h1>Pack smart.<br>Leave light.</h1>
      <p class="hero-sub">A tailored packing checklist for your destination, season, and trip length. No sign-up. No app.</p>
      <a href="#builder" class="btn btn-primary">Generate your list</a>
    </div>
  </section>

  <!-- Builder Form -->
  <section class="section" id="builder">
    <div class="container">
      <span class="eyebrow">Builder</span>
      <h2>Where are you heading?</h2>

      <form id="packing-form" novalidate>
        <!-- Destination -->
        <div class="form-group">
          <label for="destination">Destination</label>
          <select id="destination" required>
            <option value="">— Choose a destination —</option>
            <option value="bangkok">🇹🇭 Bangkok, Thailand</option>
            <option value="tokyo">🇯🇵 Tokyo, Japan</option>
            <option value="paris">🇫🇷 Paris, France</option>
            <option value="newyork">🇺🇸 New York, USA</option>
            <option value="london">🇬🇧 London, UK</option>
            <option value="sydney">🇦🇺 Sydney, Australia</option>
            <option value="cairo">🇪🇬 Cairo, Egypt</option>
            <option value="mumbai">🇮🇳 Mumbai, India</option>
            <option value="dubai">🇦🇪 Dubai, UAE</option>
            <option value="capetown">🇿🇦 Cape Town, South Africa</option>
            <option value="reykjavik">🇮🇸 Reykjavík, Iceland</option>
            <option value="cancun">🇲🇽 Cancún, Mexico</option>
          </select>
        </div>

        <!-- Season -->
        <div class="form-group">
          <label>Season</label>
          <div class="season-pills" role="radiogroup" aria-label="Season">
            <button type="button" class="pill" data-season="winter" role="radio" aria-checked="false">❄️ Winter</button>
            <button type="button" class="pill" data-season="spring" role="radio" aria-checked="false">🌸 Spring</button>
            <button type="button" class="pill" data-season="summer" role="radio" aria-checked="false">☀️ Summer</button>
            <button type="button" class="pill" data-season="fall" role="radio" aria-checked="false">🍂 Fall</button>
          </div>
          <input type="hidden" id="season" name="season" required>
        </div>

        <!-- Trip length -->
        <div class="form-group">
          <label>Trip length</label>
          <div class="trip-length" role="radiogroup" aria-label="Trip length">
            <button type="button" class="pill" data-length="short" role="radio" aria-checked="false">1–3 days</button>
            <button type="button" class="pill" data-length="medium" role="radio" aria-checked="false">4–7 days</button>
            <button type="button" class="pill" data-length="long" role="radio" aria-checked="false">8–14 days</button>
          </div>
          <input type="hidden" id="trip-length" name="trip-length" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="generate-btn" disabled>Generate packing list</button>
      </form>
    </div>
  </section>

  <!-- Results -->
  <section class="section" id="results" style="display:none;">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <div>
          <span class="eyebrow">Your list</span>
          <h2 id="results-title">Packing list</h2>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" id="print-btn">🖨️ Print</button>
          <button type="button" class="btn btn-ghost" id="start-over-btn">Start over</button>
        </div>
      </div>
      <div id="items-container"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <span>Smart Packing Checklist</span>
      <span class="muted">built by a crew · <a href="https://www.gitagent.sh/" target="_blank" rel="noopener">living in git</a> · GitAgentProtocol</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
